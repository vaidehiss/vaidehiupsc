replicaCount: 1

image:
  repository: 10.212.108.213:6001/ora/form4-graphql
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

configmap:
  name: form4-graphql-query

applicationProperties: |
  # Server Configuration
  quarkus.http.port=8080
  quarkus.http.host=0.0.0.0
  quarkus.http.root-path=/ora/query

  # CORS Configuration
  quarkus.http.cors.origins=*
  quarkus.http.cors.methods=GET,POST,OPTIONS
  quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
  quarkus.http.cors.exposed-headers=location,info

  # Logging Configuration
  quarkus.log.level=DEBUG

  # SmallRye GraphQL UI
  quarkus.smallrye-graphql.ui.always-include=true

  # Caching details
  quarkus.cache.caffeine.metrics-enabled=true
  quarkus.cache.type=caffeine
  quarkus.cache.caffeine."ora-applications".initial-capacity=10
  quarkus.cache.caffeine."ora-applications".maximum-size=25
  quarkus.cache.caffeine."ora-applications".expire-after-write=900S
  quarkus.cache.caffeine."ora-reports-by-vacancy".initial-capacity=10
  quarkus.cache.caffeine."ora-reports-by-vacancy".maximum-size=50
  quarkus.cache.caffeine."ora-reports-by-vacancy".expire-after-write=1800S

  quarkus.mongodb.metrics.enabled=true

  quarkus.mongodb.oradb.connection-string=mongodb://mongo-router.mongo-cluster.svc.cluster.local:27017
  quarkus.mongodb.oradb.database=UPSCAPPLICANTS
  quarkus.mongodb.oradb.credentials.username=canaryadmin
  quarkus.mongodb.oradb.credentials.password=CanaryAdmin123
  quarkus.mongodb.oradb.credentials.auth-source=admin

  quarkus.mongodb.cafdb.connection-string=mongodb://mongo-router.mongo-cluster.svc.cluster.local:27017
  quarkus.mongodb.cafdb.database=UPSCAPPLICANTS
  quarkus.mongodb.cafdb.credentials.username=canaryadmin
  quarkus.mongodb.cafdb.credentials.password=CanaryAdmin123
  quarkus.mongodb.cafdb.credentials.auth-source=admin

  quarkus.mongodb.userdb.connection-string=mongodb://mongo-router.mongo-cluster.svc.cluster.local:27017
  quarkus.mongodb.userdb.database=UPSCAPPLICANTS
  quarkus.mongodb.userdb.credentials.username=canaryadmin
  quarkus.mongodb.userdb.credentials.password=CanaryAdmin123
  quarkus.mongodb.userdb.credentials.auth-source=admin

  quarkus.mongodb.vacancy2026.connection-string=mongodb://mongo-router.mongo-cluster.svc.cluster.local:27017
  quarkus.mongodb.vacancy2026.database=UPSCAPPLICANTS
  quarkus.mongodb.vacancy2026.credentials.username=canaryadmin
  quarkus.mongodb.vacancy2026.credentials.password=CanaryAdmin123
  quarkus.mongodb.vacancy2026.credentials.auth-source=admin

  quarkus.devservices.enabled=false

  quarkus.rest-client."in.nic.upscora.graphql.oraApplications.client.NotificationClient".url=http://smsstreammultigate-svc.ora-upsc-canary.svc.cluster.local:8000

  # NGRP S3 document service
  quarkus.rest-client.ngrp-api.url=http://fileupload-svc.ora-upsc-canary.svc.cluster.local:9002/ora
  quarkus.rest-client.ngrp-api.disable-default-mapper=true
  ngrp.api.type=recruitment
  ngrp.api.caf.type=user
  ngrp.api.lang=en
