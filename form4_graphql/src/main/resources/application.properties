# Server Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.root-path=/ora

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info

# Logging Configuration
quarkus.log.level=DEBUG
quarkus.log.category."io.smallrye.graphql".level=INFO
quarkus.log.category."org.mongodb.driver".level=INFO
quarkus.log.category."io.quarkus.micrometer.runtime.binder.vertx.VertxHttpServerMetrics".level=INFO
# quarkus.log.category."io.smallrye.graphql".level=TRACE
# quarkus.log.category."org.eclipse.microprofile.graphql".level=TRACE
# quarkus.log.category."in.nic.upscora.graphql.ministry".level=DEBUG
# quarkus.log.category."io.quarkus".level=INFO

# SmallRye GraphQL UI
#quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.ui.always-include=true
#quarkus.smallrye-metrics.micrometer.compatibility=true

# Caching details
quarkus.cache.caffeine.metrics-enabled=true
quarkus.cache.type=caffeine
# Cache TTL and size - ora-applications
quarkus.cache.caffeine."ora-applications".initial-capacity=10
quarkus.cache.caffeine."ora-applications".maximum-size=25
quarkus.cache.caffeine."ora-applications".expire-after-write=900S
quarkus.cache.caffeine."ora-reports-by-vacancy".initial-capacity=10
quarkus.cache.caffeine."ora-reports-by-vacancy".maximum-size=50
quarkus.cache.caffeine."ora-reports-by-vacancy".expire-after-write=1800S

# Prometheus metrics endpoint
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/ora/q/metrics

