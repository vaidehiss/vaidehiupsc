apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: form4-graphql
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app: form4-graphql
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
